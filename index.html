<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MagTile Platform</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f5f0;
        color: #1c1c1a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 3rem 0;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #6b6b65;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MagTile</h1>
      <p>No content published yet.</p>
    </main>
  </body>
</html>
