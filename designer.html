<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MagTile UI Designer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #e9e9e2;
        color: #1f201c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #f7f7f1, #e5e5de 70%);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        margin-bottom: 28px;
      }

      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -0.07em; line-height: 0.95; }
      header p { color: #6e7067; margin-top: 10px; }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 22px;
        align-items: start;
      }

      .card {
        background: rgba(255, 255, 251, 0.76);
        border: 1px solid rgba(30, 31, 27, 0.12);
        border-radius: 22px;
        box-shadow: 0 18px 50px rgba(47, 48, 37, 0.08);
      }

      .stage-card { min-height: 620px; display: grid; place-items: center; padding: 34px; }

      .device-frame {
        width: min(100%, 560px);
        padding: 14px;
        border-radius: 20px;
        background: #30312c;
        box-shadow: 0 20px 40px rgba(31, 32, 28, 0.2);
      }

      #canvas {
        position: relative;
        width: 100%;
        aspect-ratio: 416 / 240;
        overflow: hidden;
        background: white;
        border: 2px solid #151613;
        touch-action: none;
      }

      #canvas.portrait { aspect-ratio: 240 / 416; width: min(100%, 360px); margin: 0 auto; }

      .text-element {
        position: absolute;
        z-index: 1;
        max-width: 90%;
        padding: 2px 4px;
        color: #111;
        font-family: Arial, sans-serif;
        line-height: 1.05;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        cursor: grab;
        user-select: none;
        transform: translate(-4px, -1em);
      }

      .text-element.selected { outline: 1px dashed #5262d9; background: rgba(82, 98, 217, 0.08); }
      .text-element:active { cursor: grabbing; }

      aside { padding: 24px; }
      aside h2 { font-size: 1.15rem; margin-bottom: 20px; letter-spacing: -0.03em; }
      label { display: block; color: #696b62; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin: 18px 0 8px; }
      input, button { font: inherit; }
      input[type="text"], input[type="password"] {
        width: 100%;
        border: 1px solid #cfd0c7;
        border-radius: 10px;
        padding: 11px 12px;
        background: #fff;
        color: #1f201c;
      }

      .row { display: flex; gap: 8px; }
      .row input { min-width: 0; }
      button { border: 0; border-radius: 10px; padding: 11px 13px; cursor: pointer; font-weight: 700; }
      button.primary { width: 100%; background: #20211d; color: white; }
      button.secondary { background: #e6e7df; color: #24251f; }
      button.danger { background: #f2dfdc; color: #8e302a; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: #e6e7df; border-radius: 12px; }
      .segmented button { background: transparent; color: #696b62; padding: 9px; }
      .segmented button.active { background: #fff; color: #20211d; box-shadow: 0 2px 8px rgba(32, 33, 29, 0.1); }
      .hint { margin-top: 10px; color: #81837a; font-size: 0.82rem; line-height: 1.45; }
      #status { min-height: 2.5em; margin-top: 16px; color: #62645b; font-size: 0.84rem; line-height: 1.4; }
      #status.error { color: #9a342d; }
      #status.success { color: #35704d; }

      @media (max-width: 820px) {
        header { display: block; }
        .workspace { grid-template-columns: 1fr; }
        .stage-card { min-height: 0; padding: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>MagTile<br />UI Designer</h1>
          <p>Place simple text on the screen and publish it to your tile.</p>
        </div>
        <a href="/" style="color:#55574f">Back to MagTile</a>
      </header>

      <section class="workspace">
        <div class="card stage-card">
          <div class="device-frame">
            <div id="canvas" aria-label="MagTile canvas"></div>
          </div>
        </div>

        <aside class="card">
          <h2>Canvas</h2>

          <label>Orientation</label>
          <div class="segmented">
            <button type="button" data-orientation="landscape" class="active">Landscape</button>
            <button type="button" data-orientation="portrait">Portrait</button>
          </div>

          <label for="text-input">Add text</label>
          <div class="row">
            <input id="text-input" type="text" maxlength="120" placeholder="Write something..." />
            <button id="add-text" type="button" class="secondary">Add</button>
          </div>

          <label for="key-input">MagTile key</label>
          <input id="key-input" type="password" autocomplete="off" placeholder="Your MagTileKey" />
          <p class="hint">The key is only sent to your own API request and is kept in this browser for convenience.</p>

          <button id="delete-text" type="button" class="danger" style="width:100%; margin-top:18px" disabled>Delete selected text</button>
          <button id="save" type="button" class="primary" style="margin-top:10px">Save to MagTile</button>
          <p class="hint">The ESP32 checks for a new layout once per minute.</p>
          <p id="status" role="status"></p>
        </aside>
      </section>
    </main>

    <script>
      const canvas = document.querySelector("#canvas");
      const textInput = document.querySelector("#text-input");
      const keyInput = document.querySelector("#key-input");
      const status = document.querySelector("#status");
      const deleteButton = document.querySelector("#delete-text");
      const saveButton = document.querySelector("#save");
      const addButton = document.querySelector("#add-text");
      const orientationButtons = [...document.querySelectorAll("[data-orientation]")];

      let orientation = "landscape";
      let elements = [];
      let selectedId = null;
      let nextId = 1;
      let drag = null;

      keyInput.value = localStorage.getItem("magtile-key") || "";

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.className = kind;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setOrientation(nextOrientation) {
        orientation = nextOrientation;
        canvas.classList.toggle("portrait", orientation === "portrait");
        orientationButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.orientation === orientation);
        });
        render();
      }

      function render() {
        canvas.replaceChildren();
        elements.forEach((item) => {
          const node = document.createElement("div");
          node.className = "text-element" + (item.id === selectedId ? " selected" : "");
          node.textContent = item.text;
          node.style.left = `${item.x * 100}%`;
          node.style.top = `${item.y * 100}%`;
          node.style.fontSize = `${item.fontSize}rem`;
          node.dataset.id = item.id;
          node.addEventListener("pointerdown", startDrag);
          node.addEventListener("click", () => select(item.id));
          canvas.appendChild(node);
        });
        deleteButton.disabled = selectedId === null;
      }

      function select(id) {
        selectedId = id;
        render();
      }

      function addText() {
        const text = textInput.value.trim();
        if (!text) {
          textInput.focus();
          return;
        }
        const item = { id: nextId++, type: "text", text, x: 0.5, y: 0.5, fontSize: 2 };
        elements.push(item);
        selectedId = item.id;
        textInput.value = "";
        render();
        setStatus("Text added. Drag it into position.");
      }

      function startDrag(event) {
        event.preventDefault();
        event.stopPropagation();
        const id = Number(event.currentTarget.dataset.id);
        selectedId = id;
        const item = elements.find((candidate) => candidate.id === id);
        const bounds = canvas.getBoundingClientRect();
        drag = { id, offsetX: event.clientX - bounds.left - item.x * bounds.width, offsetY: event.clientY - bounds.top - item.y * bounds.height };
        event.currentTarget.setPointerCapture?.(event.pointerId);
        render();
      }

      document.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const bounds = canvas.getBoundingClientRect();
        const item = elements.find((candidate) => candidate.id === drag.id);
        if (!item) return;
        item.x = clamp((event.clientX - bounds.left - drag.offsetX) / bounds.width, 0, 1);
        item.y = clamp((event.clientY - bounds.top - drag.offsetY) / bounds.height, 0, 1);
        render();
      });

      document.addEventListener("pointerup", () => { drag = null; });

      addButton.addEventListener("click", addText);
      textInput.addEventListener("keydown", (event) => { if (event.key === "Enter") addText(); });
      deleteButton.addEventListener("click", () => {
        elements = elements.filter((item) => item.id !== selectedId);
        selectedId = null;
        render();
      });
      orientationButtons.forEach((button) => button.addEventListener("click", () => setOrientation(button.dataset.orientation)));

      function authHeaders(includeContentType = false) {
        const key = keyInput.value.trim();
        const headers = { "X-MagTile-Key": key };
        if (includeContentType) headers["Content-Type"] = "application/json";
        return headers;
      }

      async function loadLayout() {
        if (!keyInput.value.trim()) {
          setStatus("Enter your MagTileKey to load the current layout.");
          return;
        }
        setStatus("Loading current layout...");
        try {
          const response = await fetch("/api/magtile", { headers: authHeaders() });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
          orientation = data.orientation === "portrait" ? "portrait" : "landscape";
          elements = (data.elements || []).map((item) => ({ ...item, id: nextId++ }));
          setOrientation(orientation);
          setStatus("Current layout loaded.", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      }

      saveButton.addEventListener("click", async () => {
        const key = keyInput.value.trim();
        if (!key) {
          setStatus("Enter your MagTileKey before saving.", "error");
          keyInput.focus();
          return;
        }
        localStorage.setItem("magtile-key", key);
        saveButton.disabled = true;
        setStatus("Saving layout...");
        try {
          const payload = {
            version: 1,
            orientation,
            elements: elements.map(({ id, ...item }) => item),
          };
          const response = await fetch("/api/magtile", {
            method: "POST",
            headers: authHeaders(true),
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
          setStatus(`Saved at ${new Date(data.updatedAt).toLocaleTimeString()}. The tile will pick it up within a minute.`, "success");
        } catch (error) {
          setStatus(error.message, "error");
        } finally {
          saveButton.disabled = false;
        }
      });

      keyInput.addEventListener("change", loadLayout);
      setOrientation("landscape");
      if (keyInput.value) loadLayout();
    </script>
  </body>
</html>
